<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fold notes">
  <defs>
    <linearGradient id="chassisBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1f19"/>
      <stop offset="100%" stop-color="#12130f"/>
    </linearGradient>
    <linearGradient id="paperSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f2ecde"/>
    </linearGradient>
    <linearGradient id="foldFlap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e07b56"/>
      <stop offset="100%" stop-color="#b8452c"/>
    </linearGradient>
    <linearGradient id="rimHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="35%" stop-color="#f2eee3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f2eee3" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="sheetShadow" x="-15%" y="-12%" width="130%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#070705" flood-opacity="0.55"/>
    </filter>
    <filter id="flapShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="6" stdDeviation="6" flood-color="#191712" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Hardware Squircle Chassis -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#chassisBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#rimHighlight)" stroke-width="3"/>

  <!-- Folded Paper Sheet -->
  <g filter="url(#sheetShadow)">
    <path d="M150 96 H302 L388 182 V390 A26 26 0 0 1 362 416 H150 A26 26 0 0 1 124 390 V122 A26 26 0 0 1 150 96 Z" fill="url(#paperSheet)"/>
  </g>

  <!-- Folded Terracotta Corner -->
  <g filter="url(#flapShadow)">
    <path d="M302 96 V160 A22 22 0 0 0 324 182 H388 Z" fill="url(#foldFlap)"/>
  </g>

  <!-- Editorial Lines -->
  <rect x="172" y="216" width="132" height="20" rx="10" fill="#191712"/>
  <rect x="172" y="262" width="168" height="16" rx="8" fill="#191712" opacity="0.72"/>
  <rect x="172" y="302" width="142" height="16" rx="8" fill="#191712" opacity="0.48"/>
  <rect x="172" y="346" width="84" height="16" rx="8" fill="#b8452c"/>
</svg>
